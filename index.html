<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Werwolf Rollen-Manager</title>
  <style>
    :root {
      --bg-darkblue: #0b0f19;
      --bg-midnight: #05070c;
      --card-bg: rgba(13, 19, 36, 0.90);
      --accent-red: #8B0000;
      --accent-purple: #4B0082;
      --accent-gold: #D4AF37;
      --accent-silver: #E0E0E0;
      --text-main: #FFFFFF;
      --text-sub: #9EABBA;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { 
      background: radial-gradient(circle at top, var(--bg-darkblue), var(--bg-midnight)); 
      color: var(--text-main); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 15px; 
    }

    #splash { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: var(--bg-midnight); 
      display: flex; flex-direction: column; justify-content: center; align-items: center; 
      z-index: 200; transition: opacity 0.8s ease, visibility 0.8s; padding: 20px; text-align: center; 
    }
    
    #splash h1 { font-size: 2.3rem; color: var(--accent-gold); margin-bottom: 10px; }
    #splash p { color: var(--text-sub); font-size: 1.1rem; margin-bottom: 30px; }
    
    .splash-btn { 
      padding: 14px 32px; 
      background: linear-gradient(45deg, var(--accent-red), var(--accent-purple)); 
      border: 1px solid var(--accent-gold); 
      border-radius: 30px; color: white; font-size: 1.2rem; font-weight: bold; cursor: pointer; 
    }

    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; margin-top: 10px; }

    .tabs { display: flex; gap: 8px; background: rgba(255,255,255,0.03); padding: 5px; border-radius: 20px; overflow-x: auto; border: 1px solid rgba(212, 175, 55, 0.1); }
    .tab-btn { flex: 1; padding: 10px 8px; border: none; background: transparent; color: var(--text-sub); font-weight: bold; border-radius: 15px; cursor: pointer; font-size: 0.85rem; transition: 0.3s; white-space: nowrap; }
    .tab-btn.active { background: var(--accent-gold); color: #000; }

    .section { display: none; flex-direction: column; gap: 15px; }
    .section.active { display: flex; }

    .card { 
      background: var(--card-bg); 
      border-radius: 16px; 
      padding: 20px; 
      border: 1px solid rgba(212, 175, 55, 0.2); 
      box-shadow: 0 8px 32px rgba(5, 7, 12, 0.7); 
      display: flex; flex-direction: column; gap: 12px; 
    }

    h3 { color: var(--accent-gold); font-size: 1.3rem; }

    textarea, input { 
      width: 100%; padding: 12px 16px; border-radius: 12px; 
      border: 1px solid rgba(224, 224, 224, 0.2); 
      background: rgba(5, 7, 12, 0.6); 
      color: var(--text-main); font-size: 1rem; outline: none; 
    }
    textarea { resize: vertical; }

    .btn { 
      padding: 12px 20px; 
      background: linear-gradient(45deg, var(--accent-gold), #b89728); 
      border: none; border-radius: 12px; color: #000; font-weight: bold; font-size: 1rem; 
      cursor: pointer; text-align: center; 
    }
    .btn:disabled { background: rgba(255,255,255,0.05); color: #555; cursor: not-allowed; }

    .btn-secondary { 
      background: rgba(255,255,255,0.05); color: var(--accent-silver); font-size: 0.9rem; 
      padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(224, 224, 224, 0.15); cursor: pointer; 
    }

    .expansion-toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 5px; }
    .exp-toggle-btn { 
      flex: 1; padding: 8px 10px; border-radius: 10px; 
      border: 1px solid rgba(75, 0, 130, 0.5); 
      background: rgba(5, 7, 12, 0.4); 
      color: var(--text-sub); font-size: 0.85rem; font-weight: bold; cursor: pointer; text-align: center; 
    }
    .exp-toggle-btn.active { background: var(--accent-purple); color: white; border-color: var(--accent-gold); }

    .role-config-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; padding-right: 5px; }
    .role-config-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.03); }

    .counter-controls { display: flex; align-items: center; gap: 10px; }
    .count-btn { 
      width: 30px; height: 30px; border-radius: 50%; border: none; 
      background: var(--accent-purple); color: white; font-weight: bold; font-size: 1.1rem; 
      cursor: pointer; display: flex; justify-content: center; align-items: center; 
    }

    .secret-card { 
      background: linear-gradient(135deg, #0f172a, var(--bg-midnight)); 
      border: 2px dashed var(--accent-gold); text-align: center; padding: 30px 20px; 
      border-radius: 16px; position: relative; overflow: hidden; min-height: 180px; 
      display: flex; flex-direction: column; justify-content: center; 
    }
    .secret-result { font-size: 1.8rem; color: var(--accent-gold); font-weight: bold; margin: 10px 0; }

    .hidden-cover { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      background: var(--bg-midnight); 
      display: flex; flex-direction: column; justify-content: center; align-items: center; 
      transition: none; cursor: pointer; padding: 20px; z-index: 10; 
    }
    .hidden-cover.revealed { transform: translateY(-100%); pointer-events: none; transition: transform 0.4s ease; }

    .role-item { background: rgba(255,255,255,0.02); padding: 12px; border-radius: 10px; border-left: 5px solid var(--accent-silver); margin-bottom: 8px; }
    .role-item.dorf { border-left-color: var(--accent-silver); }
    .role-item.wolf { border-left-color: var(--accent-red); }
    .role-item.neutral { border-left-color: var(--accent-purple); }

    .team-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-left: 6px; }
    .team-badge.dorf { background: rgba(224, 224, 224, 0.1); color: var(--accent-silver); border: 1px solid rgba(224, 224, 224, 0.3); }
    .team-badge.wolf { background: rgba(139, 0, 0, 0.25); color: #ff6b6b; border: 1px solid var(--accent-red); }
    .team-badge.neutral { background: rgba(75, 0, 130, 0.3); color: #d8b4fe; border: 1px solid var(--accent-purple); }

    .role-title { font-weight: bold; font-size: 1.1rem; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; }
    .role-desc { font-size: 0.9rem; color: var(--text-sub); margin-top: 6px; line-height: 1.3; }
    .role-category { font-size: 0.75rem; color: var(--accent-gold); text-transform: uppercase; margin-bottom: 2px; font-weight: bold; }

    .night-card-active { 
      background: linear-gradient(135deg, rgba(75, 0, 130, 0.3), var(--bg-darkblue)); 
      border: 2px solid var(--accent-gold); border-radius: 16px; padding: 20px; text-align: center; 
    }

    .player-inspect-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 15px; }
    .player-inspect-btn { 
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(212, 175, 55, 0.3); 
      padding: 10px; border-radius: 10px; color: var(--text-main); font-size: 0.9rem; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; 
    }
    .player-inspect-btn:hover { background: rgba(212, 175, 55, 0.15); border-color: var(--accent-gold); }

    .role-reveal-box { margin-top: 12px; background: rgba(5, 7, 12, 0.7); border: 1px solid var(--accent-gold); border-radius: 12px; padding: 12px; text-align: center; }
  </style>
</<body>

  <!-- Clean gehaltene Willkommensseite ohne Grafik-Spielereien -->
  <div id="splash">
    <h1 style="font-size: 2.2rem; color: var(--accent-gold); margin-bottom: 10px;">🐺 Werwolf Rollen-Manager</h1>
    <p style="color: var(--text-sub); margin-bottom: 25px;">Der Assistent für deine Spielrunde</p>
    <button class="splash-btn" onclick="closeSplash()">Loslegen</button>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('setup', this)">1. Setup</button>
      <button class="tab-btn" onclick="switchTab('distribute', this)">2. Rollen</button>
      <button class="tab-btn" onclick="switchTab('night', this)">🌙 Nacht-Ablauf</button>
      <button class="tab-btn" onclick="switchTab('guide', this)">📖 Lexikon</button>
    </div>

    <!-- TAB 1: SETUP -->
    <div id="tab-setup" class="section active">
      <div class="card">
        <h3>1. Spielernamen eingeben</h3>
        <textarea id="playerInput" rows="3">Moritz, Anna, Jonas, Lisa, Lukas</textarea>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
          <h3>2. Rollen auswählen</h3>
          <button class="btn-secondary" onclick="resetAllCounts()">Alle auf 0</button>
        </div>
        <div class="expansion-toggles">
          <button class="exp-toggle-btn active" id="toggle-Klassik" onclick="toggleExpansion('Klassik')">Klassik</button>
          <button class="exp-toggle-btn active" id="toggle-Add-on" onclick="toggleExpansion('Add-on')">Add-on</button>
          <button class="exp-toggle-btn active" id="toggle-Neumond" onclick="toggleExpansion('Neumond')">Neumond</button>
        </div>
        <div class="role-config-list" id="roleConfigContainer"></div>
        <div id="countSummary" style="font-size: 0.9rem; font-weight: bold; color: var(--accent-gold); text-align: center; margin-top: 5px;"></div>
        <button id="startBtn" class="btn" onclick="initGame()" style="margin-top: 10px;">Spiel starten & Mischen</button>
      </div>
      <div class="card" id="setupStatus" style="text-align: center; color: var(--accent-gold);">Bereit</div>
    </div>

    <!-- TAB 2: ROLLEN ZIEHEN -->
    <div id="tab-distribute" class="section">
      <div class="card" style="text-align: center;">
        <h3 id="currentTurnName">Kein Spieler</h3>
        <div class="secret-card" id="secretCardBox">
          <div class="hidden-cover" id="hiddenCover" onclick="revealRole()">
            <span style="font-size: 1.5rem; margin-bottom: 10px; color: var(--accent-gold);">🔒</span>
            <b style="color: var(--accent-silver);">Tippe hier zum Aufdecken!</b>
          </div>
          <p style="font-size: 0.9rem; color: var(--text-sub);">Deine geheime Rolle:</p>
          <div class="secret-result" id="assignedRoleName">-</div>
          <p id="assignedRoleDesc" style="font-size: 0.9rem; color: var(--text-main);">-</p>
        </div>
        <button class="btn" onclick="nextPlayer()" style="margin-top: 15px;">Nächster Spieler & verbergen</button>
      </div>
    </div>

    <!-- TAB 3: NACHT-ABLAUF -->
    <div id="tab-night" class="section">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3 id="nightTitle">🌙 Nacht 1</h3>
          <button class="btn-secondary" onclick="resetNightCounter()">Nacht-Reset</button>
        </div>
        <div id="nightDisplayBox">
          <!-- Dynamischer Schritt-Inhalt -->
        </div>
      </div>
    </div>

    <!-- TAB 4: LEXIKON -->
    <div id="tab-guide" class="section">
      <div class="card">
        <h3>Rollen-Lexikon</h3>
        <div class="expansion-toggles" style="margin-top: 5px;">
          <button class="exp-toggle-btn active" id="guide-filter-Alle" onclick="filterGuide('Alle', this)">Alle</button>
          <button class="exp-toggle-btn" id="guide-filter-Klassik" onclick="filterGuide('Klassik', this)">Klassik</button>
          <button class="exp-toggle-btn" id="guide-filter-Add-on" onclick="filterGuide('Add-on', this)">Add-on</button>
          <button class="exp-toggle-btn" id="guide-filter-Neumond" onclick="filterGuide('Neumond', this)">Neumond</button>
        </div>
        <div id="rolesListContainer" style="margin-top: 10px;"></div>
      </div>
    </div>
  </div>
  head>
  <script>
    const availableRoles = [
      // KLASSIK
      { id: "amor", name: "Amor", team: "dorf", category: "Klassik", desc: "Wacht in der 1. Nacht auf und bestimmt zwei Spieler als Liebespaar.", count: 0, nightOrder: 1, night1Only: true, canInspect: false },
      { id: "dieb", name: "Der Dieb", team: "dorf", category: "Klassik", desc: "Darf in der 1. Nacht unter zwei Extrakarten seine Rolle tauschen.", count: 0, nightOrder: 2, night1Only: true, canInspect: false },
      { id: "seherin", name: "Die Seherin", team: "dorf", category: "Klassik", desc: "Darf jede Nacht die wahre Identität eines Spielers erfahren.", count: 1, nightOrder: 5, night1Only: false, canInspect: true },
      { id: "werwolf", name: "Normaler Werwolf", team: "wolf", category: "Klassik", desc: "Tötet nachts gemeinsam mit den anderen Werwölfen ein Opfer.", count: 1, nightOrder: 8, night1Only: false, canInspect: false },
      { id: "hexe", name: "Die Hexe", team: "dorf", category: "Klassik", desc: "Kann mit dem Heiltrank retten oder mit dem Gifttrank töten.", count: 0, nightOrder: 10, night1Only: false, canInspect: false },
      { id: "dorfbewohner", name: "Einfacher Dorfbewohner", team: "dorf", category: "Klassik", desc: "Hat keine Fähigkeiten, schläft durch.", count: 2, nightOrder: 99, night1Only: false, canInspect: false },
      { id: "jaeger", name: "Der Jäger", team: "dorf", category: "Klassik", desc: "Nimmt beim eigenen Tod sofort jemanden mit.", count: 0, nightOrder: 99, night1Only: false, canInspect: false },
      { id: "hauptmann", name: "Der Hauptmann", team: "dorf", category: "Klassik", desc: "Wird gewählt; seine Stimme zählt doppelt.", count: 0, nightOrder: 99, night1Only: false, canInspect: false },
      { id: "schlafendes_maedchen", name: "Das Kleine Mädchen", team: "dorf", category: "Klassik", desc: "Darf nachts während der Werwolf-Phase heimlich linsen.", count: 0, nightOrder: 8, night1Only: false, canInspect: false },

      // CHARAKTER ADD-ON
      { id: "wilder_junge", name: "Der Wilde Junge", team: "neutral", category: "Add-on", desc: "Wählt am ersten Abend ein Vorbild aus.", count: 0, nightOrder: 4, night1Only: true, canInspect: false },
      { id: "fuchs", name: "Der Fuchs", team: "dorf", category: "Add-on", desc: "Prüft nachts 3 benachbarte Spieler nach Wölfen.", count: 0, nightOrder: 6, night1Only: false, canInspect: true },
      { id: "floete", name: "Der Flötenspieler", team: "neutral", category: "Add-on", desc: "Verzaubert nachts zwei Personen.", count: 0, nightOrder: 7, night1Only: false, canInspect: false },
      { id: "urwolf", name: "Der Urwolf", team: "wolf", category: "Add-on", desc: "Kann einmal das Opfer in einen Werwolf verwandeln.", count: 0, nightOrder: 8, night1Only: false, canInspect: false },
      { id: "grosser_wolf", name: "Der Große Böse Wolf", team: "wolf", category: "Add-on", desc: "Darf ein zweites Opfer fressen, solange kein Wolf tot ist.", count: 0, nightOrder: 8, night1Only: false, canInspect: false },
      { id: "erfinder", name: "Der Erfinder", team: "dorf", category: "Add-on", desc: "Verteilt magische Gegenstände an Mitspieler.", count: 0, nightOrder: 11, night1Only: false, canInspect: false },
      { id: "baer", name: "Der Bärenführer", team: "dorf", category: "Add-on", desc: "Knurrt morgens, falls ein Wolf direkt neben ihm sitzt.", count: 1, nightOrder: 99, night1Only: false, canInspect: false },
      { id: "ritter", name: "Der Ritter mit der rostigen Klinge", team: "dorf", category: "Add-on", desc: "Infiziert den linken Wolf beim Gefressenwerden.", count: 0, nightOrder: 99, night1Only: false, canInspect: false },
      { id: "magd", name: "Die Ergebene Magd", team: "dorf", category: "Add-on", desc: "Opfert sich bei Hinrichtung für die Rolle des Opfers.", count: 0, nightOrder: 99, night1Only: false, canInspect: false },
      { id: "richter", name: "Der Stotternde Richter", team: "dorf", category: "Add-on", desc: "Erzwingt eine zweite Abstimmung.", count: 0, nightOrder: 99, night1Only: false, canInspect: false },
      { id: "engel", name: "Der Engel", team: "dorf", category: "Add-on", desc: "Gewinnt sofort bei frühem Tod.", count: 0, nightOrder: 99, night1Only: false, canInspect: false },
      { id: "puppe", name: "Der Puppenspieler (Add-on)", team: "neutral", category: "Add-on", desc: "Kontrolliert Stimme oder Aktion eines Spielers.", count: 0, nightOrder: 12, night1Only: false, canInspect: false },
      { id: "parasit", name: "Der Parasit", team: "neutral", category: "Add-on", desc: "Fest an ein Opfer gebunden.", count: 0, nightOrder: 99, night1Only: false, canInspect: false },
      { id: "verfluchter", name: "Der Verfluchte", team: "neutral", category: "Add-on", desc: "Wird bei Wolfsbiss zum Werwolf.", count: 0, nightOrder: 99, night1Only: false, canInspect: false },
      { id: "suendenbock", name: "Der Sündenbock", team: "neutral", category: "Add-on", desc: "Stirbt automatisch bei Unentschieden.", count: 0, nightOrder: 99, night1Only: false, canInspect: false },
      { id: "zigeunerin", name: "Die Zigeunerin", team: "neutral", category: "Add-on", desc: "Stellt Fragen an Verstorbene.", count: 0, nightOrder: 14, night1Only: false, canInspect: false },

      // NEUMOND
      { id: "wolfshund", name: "Der Wolfshund", team: "neutral", category: "Neumond", desc: "Muss sich am 1. Abend für eine Seite entscheiden.", count: 0, nightOrder: 3, night1Only: true, canInspect: false },
      { id: "weiser_wolf", name: "Der Weiße Wolf", team: "wolf", category: "Neumond", desc: "Kann heimlich einen Werwolf töten.", count: 0, nightOrder: 9, night1Only: false, canInspect: false },
      { id: "brandpyromane", name: "Der Brandstifter", team: "neutral", category: "Neumond", desc: "Benetzt Ziele mit Öl und zündet sie an.", count: 0, nightOrder: 11, night1Only: false, canInspect: false },
      { id: "gaukler", name: "Der Gaukler", team: "dorf", category: "Neumond", desc: "Bringt Ereigniskarten ins Spiel.", count: 0, nightOrder: 99, night1Only: false, canInspect: false }
    ];
        const activeExpansions = { "Klassik": true, "Add-on": true, "Neumond": true };
    let currentGuideFilter = "Alle";
    let players = [], assignments = {}, currentPlayerIndex = 0;
    
    let currentNight = 1;
    let nightSteps = [];
    let currentNightStepIndex = 0;

    function closeSplash() {
      document.getElementById('splash').style.opacity = '0';
      setTimeout(() => document.getElementById('splash').style.display = 'none', 800);
      renderRoleConfig(); renderGuide(); prepareNightSequence();
    }
    function switchTab(tabId, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      btn.classList.add('active');
      if(tabId === 'night') prepareNightSequence();
    }
    function toggleExpansion(expName) {
      activeExpansions[expName] = !activeExpansions[expName];
      const btn = document.getElementById('toggle-' + expName);
      if (activeExpansions[expName]) { btn.classList.add('active'); }
      else { btn.classList.remove('active'); availableRoles.forEach(r => { if (r.category === expName) r.count = 0; }); }
      renderRoleConfig(); renderGuide(); prepareNightSequence();
    }
    function filterGuide(category, btn) {
      currentGuideFilter = category;
      document.querySelectorAll('#tab-guide .exp-toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGuide();
    }
    function resetAllCounts() { availableRoles.forEach(r => r.count = 0); renderRoleConfig(); prepareNightSequence(); }
    function getPlayerCount() { return document.getElementById('playerInput').value.split(/,|\n/).map(p => p.trim()).filter(p => p.length > 0).length; }
    function getTotalRolesCount() { let total = 0; availableRoles.forEach(r => { if (activeExpansions[r.category]) total += r.count; }); return total; }
    
    function renderRoleConfig() {
      const container = document.getElementById('roleConfigContainer');
      container.innerHTML = '';
      let totalRoles = getTotalRolesCount(), playerCount = getPlayerCount();
      availableRoles.forEach((role, index) => {
        if (!activeExpansions[role.category]) return;
        let teamBadgeText = role.team === 'wolf' ? 'Werwolf' : (role.team === 'neutral' ? 'Neutral' : 'Dorf');
        container.innerHTML += `
          <div class="role-config-row">
            <div>
              <div class="role-category">${role.category}</div>
              <div style="font-weight:bold; color: #fff;">${role.name} <span class="team-badge ${role.team}">${teamBadgeText}</span></div>
            </div>
            <div class="counter-controls">
              <button class="count-btn" onclick="updateRoleCount(${index}, -1)">-</button>
              <span style="width:25px;text-align:center;font-weight:bold;">${role.count}</span>
              <button class="count-btn" onclick="updateRoleCount(${index}, 1)">+</button>
            </div>
          </div>`;
      });
      const summary = document.getElementById('countSummary'), startBtn = document.getElementById('startBtn');
      if (totalRoles === playerCount) { summary.innerText = `Spieler: ${playerCount} | Rollen: ${totalRoles} (Perfekt!)`; summary.style.color = 'var(--accent-gold)'; startBtn.disabled = false; }
      else if (totalRoles > playerCount) { summary.innerText = `Spieler: ${playerCount} | Rollen: ${totalRoles} (Zu viele!)`; summary.style.color = '#ff6b6b'; startBtn.disabled = true; }
      else { summary.innerText = `Spieler: ${playerCount} | Rollen: ${totalRoles} (Zu wenig!)`; summary.style.color = 'var(--accent-silver)'; startBtn.disabled = true; }
    }
    function updateRoleCount(index, change) {
      if (change > 0 && getTotalRolesCount() >= getPlayerCount()) return;
      if (availableRoles[index].count + change >= 0) { availableRoles[index].count += change; renderRoleConfig(); prepareNightSequence(); }
    }

    function prepareNightSequence() {
      document.getElementById('nightTitle').innerText = `🌙 Nacht ${currentNight}`;
      
      nightSteps = availableRoles.filter(r => {
        if (!activeExpansions[r.category] || r.count === 0 || r.nightOrder >= 99) return false;
        if (currentNight > 1 && r.night1Only) return false;
        return true;
      }).sort((a,b) => a.nightOrder - b.nightOrder);

      currentNightStepIndex = 0;
      renderCurrentNightStep();
    }

    function renderCurrentNightStep() {
      const box = document.getElementById('nightDisplayBox');
      
      if (nightSteps.length === 0) {
        box.innerHTML = `<p style="text-align:center; color: var(--text-sub);">Keine aktiven Aufwach-Aktionen für diese Nacht.</p>
        <button class="btn" onclick="nextNight()" style="margin-top:15px; width:100%;">☀️ Nacht beenden & Tag starten</button>`;
        return;
      }

      const role = nightSteps[currentNightStepIndex];
      let teamBadgeText = role.team === 'wolf' ? 'Werwolf' : (role.team === 'neutral' ? 'Neutral' : 'Dorf');

      let inspectHTML = '';
      if (role.canInspect && Object.keys(assignments).length > 0) {
        inspectHTML = `
          <div style="margin-top:20px; border-top:1px solid rgba(212, 175, 55, 0.2); padding-top:15px;">
            <p style="font-size:0.85rem; color:var(--accent-gold); font-weight:bold;">🔍 ROLLE DER SPIELER PRÜFEN:</p>
            <div class="player-inspect-grid">
              ${Object.keys(assignments).map(p => `
                <button class="player-inspect-btn" onclick="inspectPlayer('${p}')">👁️ ${p}</button>
              `).join('')}
            </div>
            <div id="inspectResultContainer"></div>
          </div>`;
      }

      box.innerHTML = `
        <div class="night-card-active">
          <div style="font-size:0.85rem; color:var(--accent-gold); font-weight:bold;">SCHRITT ${currentNightStepIndex + 1} VON ${nightSteps.length}</div>
          <h2 style="color:#fff; margin:8px 0;">${role.name}</h2>
          <span class="team-badge ${role.team}">${teamBadgeText}</span>
          <p style="margin-top:15px; color:var(--text-main); font-size:1rem; line-height:1.4;">${role.desc}</p>
          ${inspectHTML}
        </div>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <button class="btn-secondary" onclick="prevNightStep()" ${currentNightStepIndex === 0 ? 'disabled' : ''} style="flex:1;">Zurück</button>
          ${currentNightStepIndex < nightSteps.length - 1 
            ? `<button class="btn" onclick="nextNightStep()" style="flex:2;">Nächster Aufruf ➔</button>`
            : `<button class="btn" onclick="nextNight()" style="flex:2; background:linear-gradient(45deg, #10b981, #059669); color:white;">☀️ Tag ausrufen</button>`}
        </div>`;
    }

    function inspectPlayer(playerName) {
      const targetRole = assignments[playerName];
      let teamBadgeText = targetRole.team === 'wolf' ? 'Werwolf' : (targetRole.team === 'neutral' ? 'Neutral' : 'Dorf');
      const container = document.getElementById('inspectResultContainer');
      container.innerHTML = `
        <div class="role-reveal-box">
          <div style="font-size:0.85rem; color:var(--text-sub);">${playerName} ist:</div>
          <div style="font-size:1.3rem; font-weight:bold; color:var(--accent-gold); margin:4px 0;">${targetRole.name}</div>
          <span class="team-badge ${targetRole.team}">${teamBadgeText}</span>
        </div>`;
    }

    function nextNightStep() {
      if (currentNightStepIndex < nightSteps.length - 1) {
        currentNightStepIndex++;
        renderCurrentNightStep();
      }
    }

    function prevNightStep() {
      if (currentNightStepIndex > 0) {
        currentNightStepIndex--;
        renderCurrentNightStep();
      }
    }

    function nextNight() {
      currentNight++;
      prepareNightSequence();
      alert(`☀️ Die Nacht ist vorbei! Der Morgen von Tag ${currentNight - 1} bricht an.`);
    }

    function resetNightCounter() {
      currentNight = 1;
      prepareNightSequence();
    }

    function initGame() {
      players = document.getElementById('playerInput').value.split(/,|\n/).map(p => p.trim()).filter(p => p.length > 0);
      let rolePool = [];
      availableRoles.forEach(role => { if (activeExpansions[role.category]) { for (let i = 0; i < role.count; i++) rolePool.push(role); } });
      if (rolePool.length !== players.length) return;
      let shuffledRoles = [...rolePool].sort(() => Math.random() - 0.5);
      assignments = {};
      players.forEach((player, index) => { assignments[player] = shuffledRoles[index]; });
      currentPlayerIndex = 0;
      currentNight = 1;
      document.getElementById('setupStatus').innerText = `✅ Rollen verteilt! Wechsel zu Reiter 2.`;
      loadCurrentPlayer();
      prepareNightSequence();
    }
    function loadCurrentPlayer() {
      if (players.length === 0) return;
      const playerName = players[currentPlayerIndex];
      document.getElementById('currentTurnName').innerText = `Handy an: ${playerName}`;
      document.getElementById('assignedRoleName').innerText = assignments[playerName].name;
      document.getElementById('assignedRoleDesc').innerText = assignments[playerName].desc;
    }
    function revealRole() { document.getElementById('hiddenCover').classList.add('revealed'); }
    function nextPlayer() {
      const cover = document.getElementById('hiddenCover');
      cover.style.transition = 'none'; cover.classList.remove('revealed');
      currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
      loadCurrentPlayer();
      setTimeout(() => { cover.style.transition = 'transform 0.4s ease'; }, 50);
    }
    function renderGuide() {
      const container = document.getElementById('rolesListContainer');
      container.innerHTML = '';
      availableRoles.forEach(r => {
        if (currentGuideFilter !== "Alle" && r.category !== currentGuideFilter) return;
        let teamBadgeText = r.team === 'wolf' ? 'Werwolf' : (r.team === 'neutral' ? 'Neutral' : 'Dorf');
        container.innerHTML += `
          <div class="role-item ${r.team}">
            <div class="role-category">${r.category}</div>
            <div class="role-title"><span>${r.name}</span><span class="team-badge ${r.team}">${teamBadgeText}</span></div>
            <div class="role-desc">${r.desc}</div>
          </div>`;
      });
    }
    document.addEventListener("DOMContentLoaded", () => { 
      renderRoleConfig();
      renderGuide();
      document.getElementById('playerInput').addEventListener('input', renderRoleConfig); 
    });
  </script>
</body>
</html>
