<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Werwolf Rollen-Manager</title>
  <style>
    :root {
      --bg-color: #1A1B2F;         /* Nachtblau */
      --card-bg: rgba(26, 27, 47, 0.95);
      --accent-red: #8B0000;        /* Blutrot */
      --text-main: #D3D3D3;         /* Silbergrau */
      --text-sub: #A0A0B0;          /* Mattes Silbergrau */
      --accent-gold: #F4D03F;       /* Mondgelb */
      --accent-green: #1E3A2B;      /* Waldgrün */
      --accent-purple: #4A154B;     /* Mystisches Dunkelviolett */
      --accent-blue: #2B4C7E;       /* Nachtblau-Kontrast */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { 
      background: radial-gradient(circle at top, #282A4A, var(--bg-color)); 
      color: var(--text-main); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 15px; 
      overscroll-behavior-y: contain; /* Verhindert das Herunterziehen zum Neuladen */
    }

    #splash { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: #111222; 
      display: flex; flex-direction: column; justify-content: center; align-items: center; 
      z-index: 200; transition: opacity 0.8s ease, visibility 0.8s; padding: 20px; text-align: center; 
    }
    #splash h1 { font-size: 2.3rem; color: var(--accent-gold); text-shadow: 0 0 20px rgba(244, 208, 63, 0.4); margin-bottom: 10px; }
    #splash p { color: var(--text-sub); font-size: 1.1rem; margin-bottom: 30px; }
    
    .splash-btn { 
      padding: 14px 32px; 
      background: linear-gradient(45deg, var(--accent-red), var(--accent-purple)); 
      border: 1px solid var(--accent-gold); border-radius: 30px; color: var(--text-main); font-size: 1.2rem; font-weight: bold; cursor: pointer; 
      box-shadow: 0 0 15px rgba(139, 0, 0, 0.6); 
    }

    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; margin-top: 10px; }

    .tabs { display: flex; gap: 8px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 20px; overflow-x: auto; border: 1px solid rgba(211,211,211,0.1); }
    .tab-btn { flex: 1; padding: 10px 8px; border: none; background: transparent; color: var(--text-sub); font-weight: bold; border-radius: 15px; cursor: pointer; font-size: 0.85rem; transition: 0.3s; white-space: nowrap; }
    .tab-btn.active { background: var(--accent-gold); color: #111222; }

    .section { display: none; flex-direction: column; gap: 15px; }
    .section.active { display: flex; }

    .card { 
      background: var(--card-bg); 
      border-radius: 16px; 
      padding: 20px; 
      border: 1px solid rgba(244, 208, 63, 0.15); 
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); 
      display: flex; flex-direction: column; gap: 12px; 
    }
       h3 { color: var(--accent-gold); font-size: 1.3rem; }

    textarea, input, select { 
      width: 100%; padding: 12px 16px; border-radius: 12px; 
      border: 1px solid rgba(211,211,211,0.2); 
      background: rgba(0,0,0,0.3); 
      color: var(--text-main); font-size: 1rem; outline: none; 
    }
    textarea { resize: vertical; }

    .btn { 
      padding: 12px 20px; 
      background: linear-gradient(45deg, var(--accent-red), #A00000); 
      border: 1px solid var(--accent-gold); border-radius: 12px; color: var(--text-main); font-weight: bold; font-size: 1rem; 
      cursor: pointer; text-align: center; box-shadow: 0 0 12px rgba(139, 0, 0, 0.4); 
    }
    .btn:disabled { background: rgba(255,255,255,0.05); color: #555; cursor: not-allowed; box-shadow: none; border-color: transparent; }

    .btn-secondary { 
      background: rgba(211,211,211,0.1); color: var(--text-main); font-size: 0.9rem; 
      padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(211,211,211,0.2); cursor: pointer; 
    }
    .btn-danger { background: var(--accent-red); color: var(--text-main); }
    .btn-success { background: var(--accent-green); color: var(--accent-gold); border: 1px solid var(--accent-gold); }

    .expansion-toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 5px; }
    .exp-toggle-btn { 
      flex: 1; padding: 8px 10px; border-radius: 10px; 
      border: 1px solid rgba(211,211,211,0.2); 
      background: rgba(0,0,0,0.2); 
      color: var(--text-sub); font-size: 0.85rem; font-weight: bold; cursor: pointer; text-align: center; 
    }
    .exp-toggle-btn.active { background: var(--accent-purple); color: var(--accent-gold); border-color: var(--accent-gold); }

    .dlc-header {
      color: var(--accent-gold);
      font-size: 0.95rem;
      font-weight: bold;
      text-transform: uppercase;
      margin: 12px 0 6px 0;
      border-bottom: 1px solid rgba(244,208,63,0.3);
      padding-bottom: 4px;
    }

    .role-config-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; padding-right: 5px; }
    .role-config-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25); padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(211,211,211,0.05); }

    .counter-controls { display: flex; align-items: center; gap: 10px; }
    .count-btn { 
      width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--accent-gold); 
      background: var(--accent-red); color: var(--text-main); font-weight: bold; font-size: 1.1rem; 
      cursor: pointer; display: flex; justify-content: center; align-items: center; 
    }
        .secret-card { 
      background: linear-gradient(135deg, #222440, #111222); 
      border: 2px dashed var(--accent-gold); text-align: center; padding: 30px 20px; 
      border-radius: 16px; position: relative; overflow: hidden; min-height: 180px; 
      display: flex; flex-direction: column; justify-content: center; 
    }
    .secret-result { font-size: 1.8rem; color: var(--accent-gold); font-weight: bold; margin: 10px 0; }

    .hidden-cover { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      background: #111222; 
      display: flex; flex-direction: column; justify-content: center; align-items: center; 
      transition: none; cursor: pointer; padding: 20px; z-index: 10; 
    }
    .hidden-cover.revealed { transform: translateY(-100%); pointer-events: none; transition: transform 0.4s ease; }

    .role-item { background: rgba(0,0,0,0.25); padding: 12px; border-radius: 10px; border-left: 5px solid var(--text-main); margin-bottom: 8px; }
    .role-item.dorf { border-left-color: var(--accent-green); }
    .role-item.wolf { border-left-color: var(--accent-red); }
    .role-item.neutral { border-left-color: var(--accent-gold); }

    .team-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-left: 6px; }
    .team-badge.dorf { background: var(--accent-green); color: var(--text-main); border: 1px solid rgba(211,211,211,0.3); }
    .team-badge.wolf { background: var(--accent-red); color: var(--text-main); border: 1px solid rgba(211,211,211,0.3); }
    .team-badge.neutral { background: var(--accent-purple); color: var(--accent-gold); border: 1px solid rgba(211,211,211,0.3); }

    .role-title { font-weight: bold; font-size: 1.1rem; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; }
    .role-desc { font-size: 0.9rem; color: var(--text-sub); margin-top: 6px; line-height: 1.3; }

    .night-card-active { 
      background: linear-gradient(135deg, rgba(74, 21, 75, 0.4), var(--card-bg)); 
      border: 2px solid var(--accent-gold); border-radius: 16px; padding: 20px; text-align: center; 
    }

    .player-inspect-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 15px; }
    .player-inspect-btn { 
      background: rgba(0,0,0,0.3); border: 1px solid rgba(211,211,211,0.2); 
      padding: 10px; border-radius: 10px; color: var(--text-main); font-size: 0.9rem; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; 
    }
    .player-inspect-btn:hover { background: rgba(244, 208, 63, 0.1); border-color: var(--accent-gold); }
    .player-inspect-btn.selected { background: var(--accent-gold); color: #111222; border-color: var(--accent-gold); }

    .role-reveal-box { margin-top: 12px; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--accent-gold); border-radius: 12px; padding: 12px; text-align: center; }
  </style>
</head>
<body>

  <!-- Splash-Screen mit Versionsnummer v1.9 -->
  <div id="splash">
    <h1>🐺 Werwolf Rollen-Manager</h1>
    <p>v1.9</p>
    <button class="splash-btn" onclick="closeSplash()">Loslegen</button>
  </div>
    <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('setup', this)">1. Setup</button>
      <button class="tab-btn" onclick="switchTab('distribute', this)">2. Rollen</button>
      <button class="tab-btn" onclick="switchTab('night', this)">🌙 Nacht & Tag</button>
      <button class="tab-btn" onclick="switchTab('guide', this)">📖 Lexikon</button>
    </div>

    <!-- TAB 1: SETUP -->
    <div id="tab-setup" class="section active">
      <div class="card">
        <h3>1. Spielernamen eingeben</h3>
        <textarea id="playerInput" rows="3" oninput="saveInputsToStorage()">Moritz, Anna, Jonas, Lisa, Lukas</textarea>
        
        <div style="margin-top: 10px; border-top: 1px solid rgba(211,211,211,0.1); padding-top: 10px;">
          <p style="font-size: 0.8rem; color: var(--accent-gold); font-weight: bold; margin-bottom: 5px;">📜 Zuletzt vorgespielte Runden:</p>
          <div id="recentGamesList" style="display: flex; flex-wrap: wrap; gap: 6px;">
            <span style="font-size: 0.8rem; color: var(--text-sub);">Noch keine vorherigen Runden gespeichert.</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
          <h3>2. Rollen auswählen</h3>
          <button class="btn-secondary" onclick="resetAllCounts()">Alle auf 0</button>
        </div>
        <div class="expansion-toggles">
          <button class="exp-toggle-btn active" id="toggle-Klassik" onclick="toggleExpansion('Klassik')">Klassik</button>
          <button class="exp-toggle-btn active" id="toggle-Charakter Pack" onclick="toggleExpansion('Charakter Pack')">Charakter Pack</button>
        </div>
        <div class="role-config-list" id="roleConfigContainer"></div>
        <div id="countSummary" style="font-size: 0.9rem; font-weight: bold; color: var(--accent-gold); text-align: center; margin-top: 5px;"></div>
        <button id="startBtn" class="btn" onclick="initGame()" style="margin-top: 10px;">Spiel starten & Mischen</button>
      </div>
      <div class="card" id="setupStatus" style="text-align: center; color: var(--accent-gold);">Bereit</div>
    </div>

    <!-- TAB 2: ROLLEN ZIEHEN -->
    <div id="tab-distribute" class="section">
      <div class="card" style="text-align: center;">
        <h3 id="currentTurnName">Kein Spieler</h3>
        <div class="secret-card" id="secretCardBox">
          <div class="hidden-cover" id="hiddenCover" onclick="revealRole()">
            <span style="font-size: 1.5rem; margin-bottom: 10px;">🔒</span>
            <b>Tippe hier zum Aufdecken!</b>
          </div>
          <p style="font-size: 0.9rem; color: var(--text-sub);">Deine geheime Rolle:</p>
          <div class="secret-result" id="assignedRoleName">-</div>
          <p id="assignedRoleDesc" style="font-size: 0.9rem; color: var(--text-main);">-</p>
        </div>
        <button class="btn" onclick="nextPlayer()" style="margin-top: 15px;">Nächster Spieler & verbergen</button>
      </div>
    </div>

    <!-- TAB 3: NACHT & TAG -->
    <div id="tab-night" class="section">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3 id="nightTitle">🌙 Nacht 1</h3>
          <button class="btn-secondary" onclick="resetNightCounter()">Reset</button>
        </div>
        <div id="nightDisplayBox">
          <!-- Dynamischer Schritt-Inhalt -->
        </div>
      </div>
    </div>

    <!-- TAB 4: LEXIKON -->
    <div id="tab-guide" class="section">
      <div class="card">
        <h3>Rollen-Lexikon</h3>
        <div class="expansion-toggles" style="margin-top: 5px;">
          <button class="exp-toggle-btn active" id="guide-filter-Alle" onclick="filterGuide('Alle', this)">Alle</button>
          <button class="exp-toggle-btn" id="guide-filter-Klassik" onclick="filterGuide('Klassik', this)">Klassik</button>
          <button class="exp-toggle-btn" id="guide-filter-Charakter Pack" onclick="filterGuide('Charakter Pack', this)">Charakter Pack</button>
        </div>
        <div id="rolesListContainer" style="margin-top: 10px;"></div>
      </div>
    </div>
    </div>
    <script>
    const categoryOrder = ["Klassik", "Charakter Pack"];

    const availableRoles = [
      // 1. KLASSIK
      { id: "amor", name: "Amor", team: "dorf", category: "Klassik", desc: "Wacht in der 1. Nacht auf und bestimmt zwei Spieler als Liebespaar.", count: 0, nightOrder: 1, night1Only: true, actionType: "amor" },
      { id: "dieb", name: "Der Dieb", team: "dorf", category: "Klassik", desc: "Darf in der 1. Nacht unter zwei Extrakarten seine Rolle tauschen.", count: 0, nightOrder: 2, night1Only: true, actionType: "none" },
      { id: "seherin", name: "Die Seherin", team: "dorf", category: "Klassik", desc: "Darf jede Nacht die wahre Identität eines Spielers erfahren.", count: 1, nightOrder: 5, night1Only: false, actionType: "inspect" },
      { id: "werwolf", name: "Normaler Werwolf", team: "wolf", category: "Klassik", desc: "Tötet nachts gemeinsam mit den anderen Werwölfen ein Opfer.", count: 1, nightOrder: 8, night1Only: false, actionType: "wolfKill" },
      { id: "hexe", name: "Die Hexe", team: "dorf", category: "Klassik", desc: "Besitzt einen Heil- und einen Gifttrank für die Nacht.", count: 0, nightOrder: 10, night1Only: false, actionType: "witch" },
      { id: "dorfbewohner", name: "Einfacher Dorfbewohner", team: "dorf", category: "Klassik", desc: "Hat keine besonderen Fähigkeiten, hilft tagsüber.", count: 2, nightOrder: 99, night1Only: false, actionType: "none" },
      { id: "jaeger", name: "Der Jäger", team: "dorf", category: "Klassik", desc: "Reißt beim eigenen Tod sofort einen Spieler mit in den Tod.", count: 0, nightOrder: 99, night1Only: false, actionType: "none" },
      { id: "hauptmann", name: "Der Hauptmann", team: "dorf", category: "Klassik", desc: "Wird vom Dorf gewählt; seine Stimme zählt bei Abstimmungen doppelt.", count: 0, nightOrder: 99, night1Only: false, actionType: "none" },
      { id: "schlafendes_maedchen", name: "Das Kleine Mädchen", team: "dorf", category: "Klassik", desc: "Darf nachts heimlich blinzeln, um die Werwölfe zu beobachten.", count: 0, nightOrder: 8, night1Only: false, actionType: "none" },

      // 2. CHARAKTER PACK
      { id: "wilder_junge", name: "Der Wilde Junge", team: "neutral", category: "Charakter Pack", desc: "Wählt am ersten Abend ein Vorbild aus.", count: 0, nightOrder: 4, night1Only: true, actionType: "none" },
      { id: "fuchs", name: "Der Fuchs", team: "dorf", category: "Charakter Pack", desc: "Beschnüffelt nachts benachbarte Spieler nach Wölfen.", count: 0, nightOrder: 6, night1Only: false, actionType: "inspect" },
      { id: "floete", name: "Der Flötenspieler", team: "neutral", category: "Charakter Pack", desc: "Verzaubert nachts zwei Personen.", count: 0, nightOrder: 7, night1Only: false, actionType: "none" },
      { id: "urwolf", name: "Der Urwolf", team: "wolf", category: "Charakter Pack", desc: "Kann einmal das nächtliche Opfer in einen Werwolf verwandeln.", count: 0, nightOrder: 8, night1Only: false, actionType: "wolfKill" },
      { id: "grosser_wolf", name: "Der Große Böse Wolf", team: "wolf", category: "Charakter Pack", desc: "Darf nachts ein zweites Opfer fressen, solange kein Wolf starb.", count: 0, nightOrder: 8, night1Only: false, actionType: "wolfKill" },
      { id: "erfinder", name: "Der Erfinder", team: "dorf", category: "Charakter Pack", desc: "Verteilt magische Hilfsmittel an Mitspieler.", count: 0, nightOrder: 11, night1Only: false, actionType: "inventor" },
      { id: "baer", name: "Der Bärenführer", team: "dorf", category: "Charakter Pack", desc: "Knurrt morgens, wenn ein Wolf neben ihm sitzt.", count: 0, nightOrder: 99, night1Only: false, actionType: "none" },
      { id: "ritter", name: "Der Ritter", team: "dorf", category: "Charakter Pack", desc: "Infiziert den linken Wolf beim Gefressenwerden.", count: 0, nightOrder: 99, night1Only: false, actionType: "none" },
      { id: "magd", name: "Die Ergebene Magd", team: "dorf", category: "Charakter Pack", desc: "Opfert sich bei Hinrichtung für die Rolle des Opfers.", count: 0, nightOrder: 99, night1Only: false, actionType: "none" },
      { id: "richter", name: "Der Stotternde Richter", team: "dorf", category: "Charakter Pack", desc: "Erzwingt eine zweite Abstimmung.", count: 0, nightOrder: 99, night1Only: false, actionType: "none" },
      { id: "engel", name: "Der Engel", team: "dorf", category: "Charakter Pack", desc: "Gewinnt sofort allein bei frühem Tod.", count: 0, nightOrder: 99, night1Only: false, actionType: "none" },
      { id: "puppe", name: "Der Puppenspieler", team: "neutral", category: "Charakter Pack", desc: "Kontrolliert Stimme oder Aktion eines Spielers.", count: 0, nightOrder: 12, night1Only: false, actionType: "none" },
      { id: "parasit", name: "Der Parasit", team: "neutral", category: "Charakter Pack", desc: "Fest an ein Wirt-Schicksal gebunden.", count: 0, nightOrder: 99, night1Only: false, actionType: "none" },
      { id: "verfluchter", name: "Der Verfluchte", team: "neutral", category: "Charakter Pack", desc: "Wird bei Wolfsbiss sofort zum Werwolf.", count: 0, nightOrder: 99, night1Only: false, actionType: "none" },
      { id: "suendenbock", name: "Der Sündenbock", team: "neutral", category: "Charakter Pack", desc: "Stirbt automatisch bei Unentschieden.", count: 0, nightOrder: 99, night1Only: false, actionType: "none" },
      { id: "zigeunerin", name: "Die Zigeunerin", team: "neutral", category: "Charakter Pack", desc: "Stellt Fragen an Verstorbene.", count: 0, nightOrder: 14, night1Only: false, actionType: "none" }
    ];

    const activeExpansions = { "Klassik": true, "Charakter Pack": true };
    let currentGuideFilter = "Alle";
    let players = [], assignments = {}, currentPlayerIndex = 0;
    let currentNight = 1;
    let nightSteps = [];
    let currentNightStepIndex = 0;
    
    let lovers = [];
    let deadPlayers = [];
    let captain = null;
    let witchState = { healUsed: false, poisonUsed: false };
    let nightSummary = { victim: null, witchAction: null };
    let recentGames = [];

    function loadFromStorage() {
      const savedPlayers = localStorage.getItem('ww_players');
      if (savedPlayers) document.getElementById('playerInput').value = savedPlayers;
      
      const savedRoles = localStorage.getItem('ww_roles');
      if (savedRoles) {
        try {
          const parsed = JSON.parse(savedRoles);
          availableRoles.forEach(r => {
            if (parsed[r.id] !== undefined) r.count = parsed[r.id];
          });
        } catch(e) {}
      }

      const savedHistory = localStorage.getItem('ww_history');
      if (savedHistory) {
        try { recentGames = JSON.parse(savedHistory); } catch(e) {}
      }
    }

    function saveInputsToStorage() {
      localStorage.setItem('ww_players', document.getElementById('playerInput').value);
      let roleCounts = {};
      availableRoles.forEach(r => roleCounts[r.id] = r.count);
      localStorage.setItem('ww_roles', JSON.stringify(roleCounts));
    }
      function closeSplash() {
      document.getElementById('splash').style.opacity = '0';
      setTimeout(() => document.getElementById('splash').style.display = 'none', 800);
      renderRoleConfig(); renderGuide(); prepareNightSequence();
      loadRecentGamesUI();
    }
    function switchTab(tabId, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      btn.classList.add('active');
      if(tabId === 'night') prepareNightSequence();
    }
    function toggleExpansion(expName) {
      activeExpansions[expName] = !activeExpansions[expName];
      const btn = document.getElementById('toggle-' + expName);
      if (activeExpansions[expName]) { btn.classList.add('active'); }
      else { btn.classList.remove('active'); availableRoles.forEach(r => { if (r.category === expName) r.count = 0; }); }
      renderRoleConfig(); renderGuide(); prepareNightSequence();
      saveInputsToStorage();
    }
    function filterGuide(category, btn) {
      currentGuideFilter = category;
      document.querySelectorAll('#tab-guide .exp-toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGuide();
    }
    function resetAllCounts() { availableRoles.forEach(r => r.count = 0); renderRoleConfig(); prepareNightSequence(); saveInputsToStorage(); }
    function getPlayerCount() { return document.getElementById('playerInput').value.split(/,|\n/).map(p => p.trim()).filter(p => p.length > 0).length; }
    function getTotalRolesCount() { let total = 0; availableRoles.forEach(r => { if (activeExpansions[r.category]) total += r.count; }); return total; }

    function renderRoleConfig() {
      const container = document.getElementById('roleConfigContainer');
      container.innerHTML = '';

      categoryOrder.forEach(cat => {
        if (!activeExpansions[cat]) return;
        const rolesInCat = availableRoles.filter(r => r.category === cat);
        if (rolesInCat.length === 0) return;

        container.innerHTML += `<div class="dlc-header">📦 ${cat}</div>`;

        rolesInCat.forEach(role => {
          const globalIndex = availableRoles.findIndex(r => r.id === role.id);
          let teamBadgeText = role.team === 'wolf' ? 'Werwolf' : (role.team === 'neutral' ? 'Neutral' : 'Dorf');
          container.innerHTML += `
            <div class="role-config-row">
              <div>
                <div style="font-weight:bold; color: #fff;">${role.name} <span class="team-badge ${role.team}">${teamBadgeText}</span></div>
              </div>
               <div class="counter-controls">
                <button class="count-btn" onclick="updateRoleCount(${globalIndex}, -1)">-</button>
                <span style="width:25px;text-align:center;font-weight:bold;">${role.count}</span>
                <button class="count-btn" onclick="updateRoleCount(${globalIndex}, 1)">+</button>
              </div>
            </div>`;
        });
      });

      const summary = document.getElementById('countSummary'), startBtn = document.getElementById('startBtn');
      let totalRoles = getTotalRolesCount(), playerCount = getPlayerCount();
      if (totalRoles === playerCount) { summary.innerText = `Spieler: ${playerCount} | Rollen: ${totalRoles} (Perfekt!)`; summary.style.color = 'var(--text-main)'; startBtn.disabled = false; }
      else if (totalRoles > playerCount) { summary.innerText = `Spieler: ${playerCount} | Rollen: ${totalRoles} (Zu viele!)`; summary.style.color = 'var(--accent-red)'; startBtn.disabled = true; }
      else { summary.innerText = `Spieler: ${playerCount} | Rollen: ${totalRoles} (Zu wenig!)`; summary.style.color = 'var(--accent-gold)'; startBtn.disabled = true; }
    }

    function updateRoleCount(index, change) {
      if (change > 0 && getTotalRolesCount() >= getPlayerCount()) return;
      if (availableRoles[index].count + change >= 0) { availableRoles[index].count += change; renderRoleConfig(); prepareNightSequence(); saveInputsToStorage(); }
    }

    function prepareNightSequence() {
      document.getElementById('nightTitle').innerText = `🌙 Nacht ${currentNight}`;
      
      nightSteps = availableRoles.filter(r => {
        if (!activeExpansions[r.category] || r.count === 0 || r.nightOrder >= 99) return false;
        if (currentNight > 1 && r.night1Only) return false;
        return true;
      }).sort((a,b) => a.nightOrder - b.nightOrder);

      currentNightStepIndex = 0;
      renderCurrentNightStep();
    }

    function renderCurrentNightStep() {
      const box = document.getElementById('nightDisplayBox');
      
      if (currentNightStepIndex >= nightSteps.length) {
        renderDayVotingPhase();
        return;
      }

      const role = nightSteps[currentNightStepIndex];
      let teamBadgeText = role.team === 'wolf' ? 'Werwolf' : (role.team === 'neutral' ? 'Neutral' : 'Dorf');
      let interactiveHTML = '';

      if (role.actionType === 'amor') {
        interactiveHTML = `
          <div style="margin-top:15px; border-top:1px solid rgba(211,211,211,0.1); pt:10px;">
            <p style="font-size:0.85rem; color:var(--accent-gold); font-weight:bold;">💘 Wähle 2 Spieler als Liebespaar:</p>
            <div class="player-inspect-grid">
              ${players.map(p => `<button class="player-inspect-btn ${lovers.includes(p) ? 'selected' : ''}" onclick="toggleAmorSelection('${p}', this)">${p}</button>`).join('')}
            </div>
            <p id="amorStatus" style="font-size:0.85rem; color:var(--accent-gold); margin-top:8px; text-align:center;"></p>
          </div>`;
      }
      if (role.actionType === 'inspect') {
        interactiveHTML = `
          <div style="margin-top:15px; border-top:1px solid rgba(211,211,211,0.1); pt:10px;">
            <p style="font-size:0.85rem; color:var(--accent-gold); font-weight:bold;">🔍 Wähle einen Spieler zum Untersuchen:</p>
            <div class="player-inspect-grid">
              ${players.map(p => `<button class="player-inspect-btn" onclick="inspectPlayer('${p}')">👁️ ${p}</button>`).join('')}
            </div>
            <div id="inspectResultContainer"></div>
          </div>`;
      }
      if (role.actionType === 'wolfKill') {
        interactiveHTML = `
          <div style="margin-top:15px; border-top:1px solid rgba(211,211,211,0.1); pt:10px;">
            <p style="font-size:0.85rem; color:var(--accent-gold); font-weight:bold;">🐺 Wer wählt das Wolfsopfer?</p>
            <div class="player-inspect-grid">
              ${players.map(p => `<button class="player-inspect-btn" onclick="setWolfVictim('${p}', this)">🩸 ${p}</button>`).join('')}
            </div>
            <p id="wolfVictimStatus" style="font-size:0.85rem; color:var(--accent-red); margin-top:8px; text-align:center;"></p>
          </div>`;
      }
      if (role.actionType === 'witch') {
        interactiveHTML = `
          <div style="margin-top:15px; border-top:1px solid rgba(211,211,211,0.1); pt:10px;">
            <p style="font-size:0.85rem; color:var(--accent-gold); font-weight:bold;">🧪 Hexen-Tränke:</p>
            <p style="font-size:0.85rem; color:var(--text-sub); margin-bottom:8px;">Das Wolfsopfer dieser Nacht ist: <b>${nightSummary.victim || 'Niemand / Unbekannt'}</b></p>
            <div style="display:flex; flex-direction:column; gap:8px;">
              <button class="btn btn-success" onclick="witchHeal()" ${witchState.healUsed || !nightSummary.victim ? 'disabled' : ''}>
                ${witchState.healUsed ? 'Heiltrank bereits verwendet' : '💚 Opfer heilen'}
              </button>
              <select id="witchPoisonSelect" style="margin-top:5px;">
                <option value="">-- Niemanden vergiften --</option>
                ${players.map(p => `<option value="${p}">Gifttrank auf ${p} anwenden</option>`).join('')}
              </select>
              <button class="btn btn-danger" onclick="witchPoison()" ${witchState.poisonUsed ? 'disabled' : ''}>
                ${witchState.poisonUsed ? 'Gifttrank bereits verwendet' : '☠️ Gifttrank nutzen'}
              </button>
            </div>
            <p id="witchStatus" style="font-size:0.85rem; color:var(--accent-gold); margin-top:8px; text-align:center;"></p>
          </div>`;
      }

      box.innerHTML = `
        <div class="night-card-active">
          <div style="font-size:0.85rem; color:var(--accent-gold); font-weight:bold;">SCHRITT ${currentNightStepIndex + 1} VON ${nightSteps.length}</div>
          <h2 style="color:#fff; margin:8px 0;">${role.name}</h2>
          <span class="team-badge ${role.team}">${teamBadgeText}</span>
          <p style="margin-top:10px; color:var(--text-main); font-size:0.95rem; line-height:1.4;">${role.desc}</p>
          ${interactiveHTML}
        </div>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <button class="btn-secondary" onclick="prevNightStep()" ${currentNightStepIndex === 0 ? 'disabled' : ''} style="flex:1;">Zurück</button>
          <button class="btn" onclick="nextNightStep()" style="flex:2;">Nächster Schritt ➔</button>
        </div>`;
    }

    let tempAmorPicks = [];
    function toggleAmorSelection(name, btn) {
      if (tempAmorPicks.includes(name)) {
        tempAmorPicks = tempAmorPicks.filter(p => p !== name);
        btn.classList.remove('selected');
      } else {
        if (tempAmorPicks.length < 2) {
          tempAmorPicks.push(name);
          btn.classList.add('selected');
        }
      }
      if (tempAmorPicks.length === 2) {
        lovers = [...tempAmorPicks];
        document.getElementById('amorStatus').innerText = `✅ Liebespaar bestimmt: ${lovers[0]} & ${lovers[1]}!`;
      } else {
        document.getElementById('amorStatus').innerText = `Wähle noch ${2 - tempAmorPicks.length} Spieler aus.`;
      }
    }

    function inspectPlayer(playerName) {
      const targetRole = assignments[playerName];
      let teamBadgeText = targetRole.team === 'wolf' ? 'Werwolf' : (targetRole.team === 'neutral' ? 'Neutral' : 'Dorf');
      const container = document.getElementById('inspectResultContainer');
      container.innerHTML = `
        <div class="role-reveal-box">
          <div style="font-size:0.85rem; color:var(--text-sub);">${playerName} ist:</div>
          <div style="font-size:1.3rem; font-weight:bold; color:var(--accent-gold); margin:4px 0;">${targetRole.name}</div>
          <span class="team-badge ${targetRole.team}">${teamBadgeText}</span>
        </div>`;
    }

    function setWolfVictim(playerName, btn) {
      nightSummary.victim = playerName;
      document.querySelectorAll('#nightDisplayBox .player-inspect-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('wolfVictimStatus').innerText = `🩸 Wolfsopfer gewählt: ${playerName}`;
    }

    function witchHeal() {
      if (!nightSummary.victim || witchState.healUsed) return;
      nightSummary.healed = nightSummary.victim;
      nightSummary.victim = null;
      witchState.healUsed = true;
      document.getElementById('witchStatus').innerText = `💚 Opfer wurde geheilt!`;
    }

    function witchPoison() {
      if (witchState.poisonUsed) return;
      const target = document.getElementById('witchPoisonSelect').value;
      if (target) {
        nightSummary.poisonTarget = target;
        witchState.poisonUsed = true;
        document.getElementById('witchStatus').innerText = `☠️ Gifttrank auf ${target} angewendet!`;
      }
    }

    function selectCaptain(playerName) {
      captain = playerName;
      renderDayVotingPhase();
    }

    function nextNightStep() { currentNightStepIndex++; renderCurrentNightStep(); }
    function prevNightStep() { if (currentNightStepIndex > 0) { currentNightStepIndex--; renderCurrentNightStep(); } }

    function renderDayVotingPhase() {
      const box = document.getElementById('nightDisplayBox');
      let nightDeaths = [];
      if (nightSummary.victim && !deadPlayers.includes(nightSummary.victim)) nightDeaths.push(nightSummary.victim);
      if (nightSummary.poisonTarget && !deadPlayers.includes(nightSummary.poisonTarget)) nightDeaths.push(nightSummary.poisonTarget);

      nightDeaths.forEach(victim => {
        if (!deadPlayers.includes(victim)) deadPlayers.push(victim);
        if (lovers.includes(victim)) {
          const partner = lovers.find(p => p !== victim);
          if (partner && !deadPlayers.includes(partner)) {
            deadPlayers.push(partner);
            alert(`💔 Kummer-Tod! Da ${victim} gestorben ist, stirbt der Partner ${partner} sofort mit!`);
          }
        }
      });

      let captainDied = captain && deadPlayers.includes(captain);
      let captainHTML = '';
      if (!captain) {
        captainHTML = `
          <div style="background:rgba(244, 208, 63, 0.1); border:1px solid var(--accent-gold); padding:10px; border-radius:10px; margin-top:10px;">
            <p style="font-size:0.85rem; color:var(--accent-gold); font-weight:bold;">👑 Wähle den Hauptmann des Dorfes:</p>
            <div class="player-inspect-grid">
              ${players.filter(p => !deadPlayers.includes(p)).map(p => `<button class="player-inspect-btn" onclick="selectCaptain('${p}')">👑 ${p}</button>`).join('')}
            </div>
          </div>`;
      } else if (captainDied) {
        captainHTML = `
          <div style="background:rgba(139, 0, 0, 0.2); border:1px solid var(--accent-red); padding:10px; border-radius:10px; margin-top:10px;">
            <p style="font-size:0.85rem; color:var(--accent-gold); font-weight:bold;">💀 Hauptmann (${captain}) ist tot! Wähle Nachfolger:</p>
            <div class="player-inspect-grid">
              ${players.filter(p => !deadPlayers.includes(p)).map(p => `<button class="player-inspect-btn" onclick="selectCaptain('${p}')">👑 ${p}</button>`).join('')}
            </div>
          </div>`;
      } else {
        captainHTML = `<p style="margin-top:5px; font-size:0.85rem; color:var(--accent-gold);">👑 Aktueller Hauptmann: <b>${captain}</b></p>`;
      }

      box.innerHTML = `
        <div class="card" style="background: rgba(0,0,0,0.3); border: 2px solid var(--accent-gold);">
          <h2 style="color:var(--accent-gold); text-align:center;">☀️ Morgen von Tag ${currentNight}</h2>
          <div style="background:rgba(0,0,0,0.4); padding:12px; border-radius:10px; margin-top:8px;">
            <p><b>Tote in dieser Nacht:</b> ${nightDeaths.length > 0 ? nightDeaths.join(', ') : 'Niemand'}</p>
            ${captainHTML}
          </div>
          <h3 style="margin-top:15px; font-size:1.1rem; color:var(--accent-gold);">⚖️ Dorfabstimmung (Hinrichtung)</h3>
          <div class="player-inspect-grid" style="margin-top:8px;">
            ${players.map(p => `
              <button class="player-inspect-btn ${deadPlayers.includes(p) ? 'selected' : ''}" onclick="lynchPlayer('${p}')" ${deadPlayers.includes(p) ? 'disabled' : ''}>${deadPlayers.includes(p) ? '💀 ' + p + ' (Tot)' : (p === captain ? '👑 ' + p : '⚖️ ' + p)}
              </button>
            `).join('')}
          </div>
          <button class="btn" onclick="finishDayAndNextNight()" style="margin-top:15px; background:linear-gradient(45deg, var(--accent-purple), #6A1B6D); color:var(--accent-gold);">
            🌙 Nächste Nacht einläuten
          </button>
        </div>`;
    }

    function lynchPlayer(playerName) {
      if (!deadPlayers.includes(playerName)) {
        deadPlayers.push(playerName);
        if (lovers.includes(playerName)) {
          const partner = lovers.find(p => p !== playerName);
          if (partner && !deadPlayers.includes(partner)) {
            deadPlayers.push(partner);
            alert(`💔 Liebeskummer-Tod von ${partner}!`);
          }
        }
        renderDayVotingPhase();
      }
    }

    function finishDayAndNextNight() {
      currentNight++;
      nightSummary = { victim: null, witchAction: null, healed: null, poisonTarget: null };
      prepareNightSequence();
    }

    function resetNightCounter() {
      currentNight = 1;
      deadPlayers = [];
      lovers = [];
      captain = null;
      prepareNightSequence();
    }

    function initGame() {
      players = document.getElementById('playerInput').value.split(/,|\n/).map(p => p.trim()).filter(p => p.length > 0);
      
      let playerString = players.join(', ');
      if (playerString && !recentGames.includes(playerString)) {
        recentGames.unshift(playerString);
        if (recentGames.length > 3) recentGames.pop();
        localStorage.setItem('ww_history', JSON.stringify(recentGames));
        loadRecentGamesUI();
      }

      let rolePool = [];
      availableRoles.forEach(role => { if (activeExpansions[role.category]) { for (let i = 0; i < role.count; i++) rolePool.push(role); } });
      if (rolePool.length !== players.length) return;
      let shuffledRoles = [...rolePool].sort(() => Math.random() - 0.5);
      assignments = {};
      players.forEach((player, index) => { assignments[player] = shuffledRoles[index]; });
      currentPlayerIndex = 0;
      currentNight = 1;
      deadPlayers = [];
      lovers = [];
      captain = null;
      document.getElementById('setupStatus').innerText = `✅ Rollen verteilt! Wechsel zu Reiter 2.`;
      loadCurrentPlayer();
      prepareNightSequence();
    }

    function loadRecentGamesUI() {
      const container = document.getElementById('recentGamesList');
      if (recentGames.length === 0) {
        container.innerHTML = `<span style="font-size: 0.8rem; color: var(--text-sub);">Noch keine vorherigen Runden gespeichert.</span>`;
        return;
      }
      container.innerHTML = recentGames.map((game, idx) => `
        <button class="btn-secondary" style="font-size:0.75rem; padding:4px 8px;" onclick="restoreGame('${game}')">Runde ${idx+1}: (${game.split(',').length} Spieler)</button>
      `).join('');
    }

    function restoreGame(gameNames) {
      document.getElementById('playerInput').value = gameNames;
      renderRoleConfig();
      saveInputsToStorage();
    }

    function loadCurrentPlayer() {
      if (players.length === 0) return;
      const playerName = players[currentPlayerIndex];
      document.getElementById('currentTurnName').innerText = `Handy an: ${playerName}`;
      document.getElementById('assignedRoleName').innerText = assignments[playerName].name;
      document.getElementById('assignedRoleDesc').innerText = assignments[playerName].desc;
    }
    function revealRole() { document.getElementById('hiddenCover').classList.add('revealed'); }
    function nextPlayer() {
      const cover = document.getElementById('hiddenCover');
      cover.style.transition = 'none'; cover.classList.remove('revealed');
      currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
      loadCurrentPlayer();
      setTimeout(() => { cover.style.transition = 'transform 0.4s ease'; }, 50);
    }
    function renderGuide() {
      const container = document.getElementById('rolesListContainer');
      container.innerHTML = '';

      categoryOrder.forEach(cat => {
        if (currentGuideFilter !== "Alle" && currentGuideFilter !== cat) return;
        const rolesInCat = availableRoles.filter(r => r.category === cat);
        if (rolesInCat.length === 0) return;

        container.innerHTML += `<div class="dlc-header">📦 ${cat}</div>`;

        rolesInCat.forEach(r => {
          let teamBadgeText = r.team === 'wolf' ? 'Werwolf' : (r.team === 'neutral' ? 'Neutral' : 'Dorf');
          container.innerHTML += `
            <div class="role-item ${r.team}">
              <div class="role-title"><span>${r.name}</span><span class="team-badge ${r.team}">${teamBadgeText}</span></div>
              <div class="role-desc">${r.desc}</div>
            </div>`;
        });
      });
    }
    document.addEventListener("DOMContentLoaded", () => { 
      loadFromStorage();
      renderRoleConfig();
      renderGuide();
      loadRecentGamesUI();
    });
  </script>
</body>
</html>
